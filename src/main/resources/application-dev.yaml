server:
  port: 8080

spring:

  datasource:
    url: ${TORO_DB_URL:jdbc:postgresql://localhost:5432/toro_db}
    username: ${TORO_DB_USERNAME:dev}
    password: ${TORO_DB_PASSWORD:dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    issuer: toro
    secret: t+XM1I+z9utvvDpeRBL7uqN5exp5ov2d4XG8qS3XzPQ=
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
